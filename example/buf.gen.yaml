version: v2
plugins:
  - local: protoc-gen-buffa
    out: src/generated/messages
    opt: [json=true, views=true]
  - local: protoc-gen-buffa-packaging
    out: src/generated/messages
    strategy: all
  - local: protoc-gen-connect-rust
    out: src/generated/services
    opt: [buffa_module=crate::proto, gate_client_feature]
  - local: protoc-gen-buffa-packaging
    out: src/generated/services
    strategy: all
    opt: [filter=services]
  - local: protoc-gen-orm-rust
    out: src/generated/orm
  - local: protoc-gen-es
    out: web/src/gen
    include_imports: true
    opt: [target=js]
